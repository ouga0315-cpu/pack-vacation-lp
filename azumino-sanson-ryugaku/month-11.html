.gallery figure:hover img{transform:scale(1.03);}
footer{border-top:1px solid #e6dfd1;padding:40px 0 60px;text-align:center;background:#fff;}

footer a.cta:hover{opacity:.9;}
footer .back2{display:block;margin-top:20px;color:var(--sub);text-decoration:none;font-size:0.9rem;}
@media (max-width:640px){
  h1{font-size:1.5rem;}
  .intro p{font-size:0.95rem;line-height:1.9;}
