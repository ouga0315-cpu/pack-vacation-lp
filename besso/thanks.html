<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>お問い合わせを受け付けました｜株式会社Pack Vacation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  body{background:var(--bg-warm)}
  .thanks-wrap{
    max-width:640px;margin:0 auto;padding:80px 20px 60px;text-align:center;
  }
  .thanks-icon{
    width:88px;height:88px;margin:0 auto 32px;
    background:var(--accent);color:#fff;border-radius:50%;
    display:grid;place-items:center;
    box-shadow:0 10px 30px rgba(46,90,71,.25);
  }
  .thanks-icon svg{width:44px;height:44px}
  .thanks-wrap h1{
    font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;
    font-size:24px;line-height:1.5;color:var(--ink);
    margin:0 0 20px;letter-spacing:.03em;
  }
  .thanks-lead{font-size:15px;line-height:2;color:var(--ink);margin:0 auto 40px;max-width:480px}
  .thanks-card{
    background:#fff;border:1px solid var(--line-lt);border-radius:14px;
    padding:28px 22px;margin:0 auto 32px;text-align:left;
    box-shadow:0 4px 20px rgba(31,42,36,.06);
  }
  .thanks-card h2{
    font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;
    font-size:14px;letter-spacing:.1em;color:var(--accent);
    text-align:center;margin:0 0 14px;padding:0;
  }
  .thanks-card h2::after{display:none}
  .thanks-card p{margin:0;font-size:14px;line-height:1.95;color:var(--ink)}
  .thanks-tel{
    text-align:center;margin:32px 0 40px;
  }
  .thanks-tel .lab{font-size:12px;letter-spacing:.18em;color:var(--sub);font-weight:700;margin-bottom:8px}
  .thanks-tel a{
    font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;font-size:28px;
    color:var(--accent);text-decoration:none;letter-spacing:.04em;
    border-bottom:2px solid var(--gold);padding-bottom:4px;
  }
  .thanks-back{
    display:inline-block;padding:14px 32px;
    background:var(--accent);color:#fff;border-radius:999px;
    text-decoration:none;
    font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:14px;letter-spacing:.06em;
    box-shadow:0 4px 14px rgba(46,90,71,.22);
    transition:background .15s ease,transform .15s ease;
  }
  .thanks-back:hover{background:var(--accent-dk);transform:translateY(-2px)}
  @media(min-width:720px){
    .thanks-wrap{padding:112px 40px 80px}
    .thanks-wrap h1{font-size:30px}
    .thanks-tel a{font-size:32px}
  }
</style>
</head>
<body>

<header class="site-head">
  <div class="site-head-inner">
    <a href="index.html" class="brand">
      <strong>Pack Vacation</strong>
      <span>別荘お預かりのご相談</span>
    </a>
  </div>
</header>

<main>
  <div class="thanks-wrap">
    <div class="thanks-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4,12 10,18 20,6"/>
      </svg>
    </div>

    <h1>お問い合わせを<br>受け付けいたしました</h1>

    <p class="thanks-lead">
      このたびはご相談いただき、<br>
      誠にありがとうございます。<br><br>
      1〜2営業日以内に、<br>
      代表 三條 よりご連絡いたします。
    </p>

    <div class="thanks-card">
      <h2>お急ぎの場合</h2>
      <p>内容によってはメールが届かないことがございます。1週間以上ご連絡がない場合は、お手数ですが下記までお電話いただけますと幸いです。</p>
    </div>

    <div class="thanks-tel">
      <p class="lab">お電話でのご相談</p>
      <a href="tel:09063083620">090-6308-3620</a>
    </div>

    <a href="index.html" class="thanks-back">LPに戻る</a>
  </div>
</main>

<footer class="page-foot">
  <div class="wrap">
    <p><strong>株式会社Pack Vacation</strong></p>
    <p>長野県安曇野市穂高有明7403-30</p>
    <p>TEL 090-6308-3620 ／ <a href="mailto:ouga0315@gmail.com">ouga0315@gmail.com</a></p>
  </div>
</footer>

</body>
</html>
